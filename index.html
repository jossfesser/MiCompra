<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Compra</title>
 
<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,Helvetica,sans-serif;
}
 
body{
background:#f3f6f5;
padding-bottom:100px;
}
 
header{
background:#0f766e;
color:white;
padding:20px;
position:sticky;
top:0;
z-index:100;
}
 
header h1{
font-size:28px;
}
 
.container{
max-width:900px;
margin:auto;
padding:15px;
}
 
.card{
background:white;
border-radius:15px;
padding:15px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}
 
.section-title{
font-size:22px;
margin-bottom:10px;
}
 
.list-item{
display:flex;
align-items:center;
gap:10px;
padding:10px;
border-bottom:1px solid #eee;
}
 
.list-item:last-child{
border-bottom:none;
}
 
.product-name{
flex:1;
}
 
.done{
text-decoration:line-through;
opacity:.5;
}
 
.qty{
width:70px;
padding:5px;
}
 
.unit{
padding:5px;
}
 
.category{
background:white;
margin-bottom:10px;
border-radius:15px;
overflow:hidden;
box-shadow:0 2px 8px rgba(0,0,0,.06);
}
 
.category-header{
background:#fff;
padding:15px;
font-weight:bold;
cursor:pointer;
font-size:18px;
}
 
.category-content{
display:none;
padding:10px;
}
 
.category.open .category-content{
display:block;
}
 
button{
cursor:pointer;
}
 
.check{
width:22px;
height:22px;
}
 
.badge{
background:#e8faf7;
color:#0f766e;
padding:5px 10px;
border-radius:20px;
font-weight:bold;
display:inline-block;
margin-top:10px;
}
 
.footer{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
padding:15px;
box-shadow:0 -3px 10px rgba(0,0,0,.1);
font-weight:bold;
}
</style>
</head>
 
<body>
 
<header>
<h1>🛒 Mi Compra</h1>
<div class="badge" id="count">0 productos seleccionados</div>
</header>
 
<div class="container">
 
<div class="card">
<h2 class="section-title">Compra actual</h2>
<div id="shoppingList"></div>
</div>
 
<div id="categories"></div>
 
</div>
 
<div class="footer">
Lista guardada automáticamente ✅
</div>
 
<script>
 
const catalog = {
"🥛 Lácteos":[
"Leche",
"Yogur",
"Queso",
"Mantequilla",
"Huevos"
],
 
"🍗 Aves y Carnes":[
"Pechuga de pollo",
"Pavo",
"Hamburguesas",
"Ternera",
"Cerdo"
],
 
"🥬 Frutas y Verduras":[
"Plátanos",
"Manzanas",
"Tomates",
"Patatas",
"Lechuga",
"Cebolla",
"Zanahoria"
],
 
"🍝 Pasta y Arroz":[
"Pasta",
"Espaguetis",
"Arroz",
"Lentejas",
"Garbanzos"
],
 
"🧽 Limpieza":[
"Detergente",
"Suavizante",
"Papel de cocina",
"Bolsas basura",
"Lavavajillas"
],
 
"🧴 Higiene":[
"Papel higiénico",
"Gel",
"Champú",
"Desodorante",
"Pasta dientes"
],
 
"🥤 Bebidas":[
"Agua",
"Refrescos",
"Cerveza",
"Zumo"
]
};
 
let store =
JSON.parse(localStorage.getItem("mi-compra")) || {};
 
function save(){
localStorage.setItem(
"mi-compra",
JSON.stringify(store)
);
 
renderList();
}
 
function toggle(category,product){
 
if(!store[product]){
 
store[product]={
category,
quantity:1,
unit:"ud",
done:false
};
 
}else{
 
delete store[product];
 
}
 
save();
}
 
function renderCategories(){
 
const root =
document.getElementById("categories");
 
root.innerHTML="";
 
Object.entries(catalog).forEach(([cat,products])=>{
 
const div=document.createElement("div");
div.className="category";
 
div.innerHTML=`
<div class="category-header">${cat}</div>
<div class="category-content">
${products.map(p=>`
<div class="list-item">
<input
type="checkbox"
${store[p]?"checked":""}
onchange="toggle('${cat}','${p}')">
<div class="product-name">${p}</div>
</div>
`).join("")}
</div>
`;
 
div.querySelector(".category-header")
.addEventListener("click",()=>{
div.classList.toggle("open");
});
 
root.appendChild(div);
 
});
 
}
 
function renderList(){
 
const root =
document.getElementById("shoppingList");
 
const items =
Object.entries(store);
 
document.getElementById("count")
.innerText=
items.length+" productos seleccionados";
 
if(items.length===0){
 
root.innerHTML=
"<p>No hay productos seleccionados.</p>";
 
renderCategories();
return;
}
 
root.innerHTML=
items.map(([name,data])=>`
<div class="list-item">
 
<input
class="check"
type="checkbox"
${data.done?"checked":""}
onchange="markDone('${name}')">
 
<div class="product-name ${data.done?'done':''}">
${name}
<br>
<small>${data.category}</small>
</div>
 
<input
class="qty"
type="number"
min="1"
value="${data.quantity}"
onchange="changeQty('${name}',this.value)">
 
<select
class="unit"
onchange="changeUnit('${name}',this.value)">
 
<option ${data.unit==="ud"?"selected":""}>
ud
</option>
 
<option ${data.unit==="g"?"selected":""}>
g
</option>
 
<option ${data.unit==="kg"?"selected":""}>
kg
</option>
 
<option ${data.unit==="l"?"selected":""}>
l
</option>
 
</select>
 
<button onclick="removeItem('${name}')">
❌
</button>
 
</div>
`).join("");
 
renderCategories();
}
 
function markDone(product){
 
store[product].done=
!store[product].done;
 
save();
}
 
function removeItem(product){
 
delete store[product];
 
save();
}
 
function changeQty(product,val){
 
store[product].quantity=val;
 
save();
}
 
function changeUnit(product,val){
 
store[product].unit=val;
 
save();
}
 
renderList();
 
</script>
 
</body>
</html>
